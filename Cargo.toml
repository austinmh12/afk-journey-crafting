[package]
name = "afkjourney-crafting"
version = "0.1.0"
edition = "2024"
default-run = "afkjourney-crafting"

[dependencies]
rand = "0.10.3"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }

# Command line calculator
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
rayon = "1.12.0"

# Web front end (built with `trunk`)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
gloo-storage = "0.4.1"
gloo-worker = "0.7.0"
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlSelectElement", "Navigator", "Window"] }
yew = { version = "0.23.0", features = ["csr"] }

[[bin]]
name = "afkjourney-crafting"
path = "src/main.rs"

# Web worker that scores decks off the page's main thread
[[bin]]
name = "worker"
path = "src/bin/worker.rs"
