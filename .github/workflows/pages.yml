# Builds the web front end with Trunk and publishes it to GitHub Pages.
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
name: Deploy web page

on:
  push:
    branches: [trunk]
  # Allows running it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's running
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: v0.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xzf- -C /usr/local/bin trunk
          trunk --version

      - name: Test
        run: cargo test --release --locked

      # Pages serves the site from /<repository name>/, not the domain root
      - name: Build
        run: trunk build --release --locked --public-url "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
